<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Duel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        
        body {
            background: #0a0a2a;
            color: #00ffcc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1600px;
        }
        
        .game-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 900px;
        }
        
        .game-container {
            width: 1200px;
            height: 500px;
            border: 3px solid #00ffcc;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            overflow: hidden;
            position: relative;
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #ff3366;
            font-size: 2.8rem;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.9);
            letter-spacing: 2px;
        }
        
        .split-screen {
            display: flex;
            height: 100%;
            width: 100%;
            position: relative;
        }
        
        .player-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        .game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000022;
            display: block;
        }
        
        .divider {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100%;
            width: 4px;
            background-color: #00ffcc;
            box-shadow: 0 0 15px #00ffcc;
            z-index: 10;
        }
        
        .health-display {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            height: 60px;
            width: 900px;
        }
        
        .health-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }
        
        .player-tag {
            font-weight: bold;
            font-size: 1.2rem;
            padding: 5px 15px;
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 0.7);
        }
        
        .player-1-tag {
            color: #ff3366;
            border: 2px solid #ff3366;
            text-shadow: 0 0 8px rgba(255, 51, 102, 0.7);
        }
        
        .player-2-tag {
            color: #3366ff;
            border: 2px solid #3366ff;
            text-shadow: 0 0 8px rgba(51, 102, 255, 0.7);
        }
        
        .score {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffff66;
            text-shadow: 0 0 8px rgba(255, 255, 102, 0.7);
        }
        
        .health-bar-outer {
            width: 100%;
            height: 25px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            border: 2px solid #333;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.7);
        }
        
        .health-bar-inner {
            height: 100%;
            transition: width 0.3s ease;
        }
        
        .health-1 {
            background: linear-gradient(90deg, #ff0044, #ff3366);
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.8);
        }
        
        .health-2 {
            background: linear-gradient(90deg, #0044ff, #3366ff);
            box-shadow: 0 0 12px rgba(51, 102, 255, 0.8);
        }
        
        .health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 1px 1px 3px black;
        }
        
        .game-status {
            margin-top: 10px;
            font-size: 1.3rem;
            text-align: center;
            height: 40px;
            color: #ffff66;
            text-shadow: 0 0 12px rgba(255, 255, 102, 0.7);
            width: 900px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .info-section {
            margin-top: 20px;
            width: 900px;
        }
        
        .info-card {
            background-color: rgba(0, 0, 30, 0.85);
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #00aaff;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.4);
        }
        
        .info-title {
            color: #00ffcc;
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #00aaff;
            padding-bottom: 8px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.7);
        }
        
        .instructions {
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .instructions p {
            margin-bottom: 10px;
        }
        
        .instructions ul {
            padding-left: 20px;
            margin-bottom: 15px;
        }
        
        .instructions li {
            margin-bottom: 8px;
            color: #ccccff;
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        
        .restart-btn {
            padding: 12px;
            background: linear-gradient(45deg, #ff3366, #ff0044);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
        }
        
        .restart-btn:hover {
            background: linear-gradient(45deg, #ff0044, #cc0033);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 0, 68, 0.8);
        }
        
        .sound-toggle {
            padding: 12px;
            background: linear-gradient(45deg, #3366ff, #0044ff);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(51, 102, 255, 0.6);
            transition: all 0.3s;
        }
        
        .sound-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 68, 255, 0.8);
        }
        
        /* Responsiveness - same as the previous version you liked */
        @media (max-width: 950px) {
            .game-section,
            .game-header,
            .health-display,
            .game-status,
            .info-section {
                width: 95vw;
            }
            
            .game-container {
                width: 95vw;
                height: 50vh;
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="game-header">
            <h1>SPACE DUEL</h1>
        </div>
        
        <div class="game-section">
            <div class="game-container">
                <div class="split-screen">
                    <div class="player-area">
                        <canvas id="canvas-player1" class="game-canvas"></canvas>
                    </div>
                    <div class="divider"></div>
                    <div class="player-area">
                        <canvas id="canvas-player2" class="game-canvas"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="health-display">
                <div class="health-wrapper">
                    <div class="player-info">
                        <div class="player-tag player-1-tag">PLAYER 1</div>
                        <div class="score" id="score-1">0</div>
                    </div>
                    <div class="health-bar-outer">
                        <div class="health-bar-inner health-1" id="health-1"></div>
                        <div class="health-text" id="health-text-1">100%</div>
                    </div>
                </div>
                
                <div class="health-wrapper">
                    <div class="player-info">
                        <div class="score" id="score-2">0</div>
                        <div class="player-tag player-2-tag">PLAYER 2</div>
                    </div>
                    <div class="health-bar-outer">
                        <div class="health-bar-inner health-2" id="health-2"></div>
                        <div class="health-text" id="health-text-2">100%</div>
                    </div>
                </div>
            </div>
            
            <div class="game-status" id="game-status"></div>
        </div>
        
        <div class="info-section">
            <div class="info-card">
                <div class="info-title">HOW TO PLAY</div>
                <div class="instructions">
                    <p><strong>Two players battle on the same computer.</strong> First to 5 points wins!</p>
                    <ul>
                        <li>Shoot to reduce opponent's health</li>
                        <li>If ship is destroyed you lose and respawn</li>
                        <li><strong>Player 1 controls:</strong> W A S D SPACEBAR</li>
                        <li><strong>Player 2 controls:</strong> ↑ ↓ ← → ENTER</li>
                    </ul>
                    <div class="button-container">
                        <button class="restart-btn" id="restart-btn">RESTART GAME</button>
                        <button class="sound-toggle" id="sound-toggle">SOUND: ON</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game configuration
        const config = {
            playerSpeed: 6,
            projectileSpeed: 10,
            fireCooldown: 15,
            maxHealth: 100,
            respawnTime: 60,
            pointsToWin: 5,
            starCount: 100
        };

        // Fixed canvas dimensions
        const FIXED_WIDTH = 1200;
        const FIXED_HEIGHT = 500;

        let gameState = {};
        let soundEnabled = true;
        let animations = [];
        let audioContext = null;

        const canvas1 = document.getElementById('canvas-player1');
        const canvas2 = document.getElementById('canvas-player2');
        const ctx1 = canvas1.getContext('2d');
        const ctx2 = canvas2.getContext('2d');

        // Set fixed canvas sizes
        canvas1.width = FIXED_WIDTH/2;
        canvas1.height = FIXED_HEIGHT;
        canvas2.width = FIXED_WIDTH/2;
        canvas2.height = FIXED_HEIGHT;

        const healthBar1 = document.getElementById('health-1');
        const healthBar2 = document.getElementById('health-2');
        const healthText1 = document.getElementById('health-text-1');
        const healthText2 = document.getElementById('health-text-2');
        const score1 = document.getElementById('score-1');
        const score2 = document.getElementById('score-2');
        const gameStatus = document.getElementById('game-status');
        const restartBtn = document.getElementById('restart-btn');
        const soundToggle = document.getElementById('sound-toggle');

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        function playSound(freqStart, freqEnd, duration, volume = 0.07, type = 'sawtooth') {
            if (!soundEnabled) return;
            const ctx = initAudioContext();
            if (!ctx || ctx.state === 'suspended') return;

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
            gain.gain.setValueAtTime(volume, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        }

        function createShootSound() { playSound(1200, 300, 0.08, 0.08); }
        function createHitSound() { playSound(400, 150, 0.06, 0.06, 'sine'); }
        function createExplosionSound() {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => playSound(200 + i*80, 50, 0.3, 0.04, 'square'), i*30);
            }
        }

        function createHitAnimation(x, y, color) {
            animations.push({ type: 'hit', x, y, color, radius: 12, maxRadius: 35, life: 20, currentLife: 20 });
        }

        function createExplosionAnimation(x, y) {
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 5;
                animations.push({
                    type: 'explosion',
                    x, y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    color: ['#ffaa00', '#ff6600', '#ffff00'][Math.floor(Math.random() * 3)],
                    radius: 3 + Math.random() * 6,
                    life: 30,
                    currentLife: 30
                });
            }
        }

        function updateAnimations() {
            for (let i = animations.length - 1; i >= 0; i--) {
                const a = animations[i];
                a.currentLife--;
                if (a.type === 'explosion') {
                    a.x += a.dx; a.y += a.dy;
                    a.dx *= 0.95; a.dy *= 0.95;
                }
                if (a.currentLife <= 0) animations.splice(i, 1);
            }
        }

        function drawAnimations(ctx, isPlayer1) {
            animations.forEach(a => {
                const inView = isPlayer1 ? a.x <= FIXED_WIDTH/2 : a.x > FIXED_WIDTH/2;
                if (!inView) return;
                const drawX = isPlayer1 ? a.x : a.x - FIXED_WIDTH/2;

                ctx.save();
                ctx.globalAlpha = a.currentLife / a.life;

                if (a.type === 'hit') {
                    ctx.strokeStyle = a.color;
                    ctx.lineWidth = 3;
                    const r = a.maxRadius * (a.currentLife / a.life);
                    ctx.beginPath(); ctx.arc(drawX, a.y, r, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(drawX, a.y, r/2, 0, Math.PI*2); ctx.stroke();
                } else {
                    ctx.fillStyle = a.color;
                    ctx.shadowColor = a.color;
                    ctx.shadowBlur = 15;
                    ctx.beginPath(); ctx.arc(drawX, a.y, a.radius, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            });
        }

        function drawFlickeringStars(ctx, isPlayer1) {
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < config.starCount; i++) {
                const x = Math.random() * (FIXED_WIDTH / 2);
                const y = Math.random() * FIXED_HEIGHT;
                const size = 1 + Math.random() * 2;
                ctx.globalAlpha = 0.5 + Math.random() * 0.5;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function initGame() {
            config.canvasWidth = FIXED_WIDTH;
            config.canvasHeight = FIXED_HEIGHT;

            const baseSize = Math.min(config.canvasWidth, config.canvasHeight);
            config.playerSize = Math.max(20, baseSize / 35);
            config.projectileSize = config.playerSize / 5;

            gameState = {
                player1: {
                    x: config.canvasWidth / 4,
                    y: config.canvasHeight / 2,
                    health: config.maxHealth,
                    color: '#ff3366',
                    cooldown: 0,
                    isAlive: true,
                    respawnTimer: 0,
                    score: 0,
                    keys: { up: false, down: false, left: false, right: false, shoot: false }
                },
                player2: {
                    x: config.canvasWidth * 3/4,
                    y: config.canvasHeight / 2,
                    health: config.maxHealth,
                    color: '#3366ff',
                    cooldown: 0,
                    isAlive: true,
                    respawnTimer: 0,
                    score: 0,
                    keys: { up: false, down: false, left: false, right: false, shoot: false }
                },
                projectiles: [],
                gameRunning: true,
                winner: null
            };

            animations = [];
            updateHealthBars();
            updateScoreDisplay();
            updateGameStatus();
        }

        function updateHealthBars() {
            const p1 = gameState.player1.health;
            const p2 = gameState.player2.health;
            healthBar1.style.width = `${p1}%`;
            healthBar2.style.width = `${p2}%`;
            healthText1.textContent = `${p1}%`;
            healthText2.textContent = `${p2}%`;
        }

        function updateScoreDisplay() {
            score1.textContent = gameState.player1.score;
            score2.textContent = gameState.player2.score;
        }

        function updateGameStatus() {
            if (gameState.winner) {
                gameStatus.textContent = `PLAYER ${gameState.winner} WINS THE MATCH!`;
                gameStatus.style.color = gameState.winner === 1 ? '#ff3366' : '#3366ff';
            } else if (!gameState.gameRunning) {
                gameStatus.textContent = "GAME OVER!";
                gameStatus.style.color = '#ffff66';
            } else {
                gameStatus.textContent = `Player 1: ${gameState.player1.score} | Player 2: ${gameState.player2.score}`;
                gameStatus.style.color = '#ffff66';
            }
        }

        function drawShip(ctx, player, isPlayer1) {
            if (!player.isAlive) return;
            ctx.save();
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 15;
            ctx.fillStyle = player.color;

            if (isPlayer1) {
                ctx.beginPath();
                ctx.moveTo(player.x + config.playerSize, player.y);
                ctx.lineTo(player.x - config.playerSize, player.y - config.playerSize/2);
                ctx.lineTo(player.x - config.playerSize, player.y + config.playerSize/2);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffff99';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(player.x - config.playerSize/2, player.y, config.playerSize/4, 0, Math.PI*2);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.moveTo(player.x - config.playerSize, player.y);
                ctx.lineTo(player.x + config.playerSize, player.y - config.playerSize/2);
                ctx.lineTo(player.x + config.playerSize, player.y + config.playerSize/2);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffff99';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(player.x + config.playerSize/2, player.y, config.playerSize/4, 0, Math.PI*2);
                ctx.fill();
            }

            if (player.keys.up || player.keys.down || player.keys.left || player.keys.right) {
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#ffff00';
                const engineX = isPlayer1 ? player.x - config.playerSize : player.x + config.playerSize;
                ctx.beginPath();
                ctx.ellipse(engineX, player.y, config.playerSize/2, config.playerSize/4, 0, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawProjectile(ctx, p) {
            ctx.save();
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, config.projectileSize, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#ffff99';
            ctx.beginPath();
            ctx.arc(p.x - p.dx*0.4, p.y, config.projectileSize/2, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }

        function drawGame(ctx, isPlayer1) {
            ctx.fillStyle = '#000022';
            ctx.fillRect(0, 0, FIXED_WIDTH/2, FIXED_HEIGHT);

            drawFlickeringStars(ctx, isPlayer1);

            gameState.projectiles.forEach(p => {
                const inView = isPlayer1 ? p.x <= FIXED_WIDTH/2 : p.x > FIXED_WIDTH/2;
                if (inView) {
                    const drawX = isPlayer1 ? p.x : p.x - FIXED_WIDTH/2;
                    drawProjectile(ctx, { ...p, x: drawX });
                }
            });

            drawAnimations(ctx, isPlayer1);

            if (isPlayer1) {
                drawShip(ctx, gameState.player1, true);
            } else {
                const p2 = { ...gameState.player2, x: gameState.player2.x - FIXED_WIDTH/2 };
                drawShip(ctx, p2, false);
            }
        }

        function updatePlayer(player, isPlayer1) {
            if (!player.isAlive) return;

            const vel = { x: 0, y: 0 };
            if (player.keys.up) vel.y = -config.playerSpeed;
            if (player.keys.down) vel.y = config.playerSpeed;
            if (player.keys.left) vel.x = -config.playerSpeed;
            if (player.keys.right) vel.x = config.playerSpeed;

            player.x += vel.x;
            player.y += vel.y;

            const middle = FIXED_WIDTH / 2;
            if (isPlayer1) {
                player.x = Math.max(config.playerSize, Math.min(middle - config.playerSize, player.x));
            } else {
                player.x = Math.max(middle + config.playerSize, Math.min(FIXED_WIDTH - config.playerSize, player.x));
            }
            player.y = Math.max(config.playerSize, Math.min(FIXED_HEIGHT - config.playerSize, player.y));

            if (player.keys.shoot && player.cooldown <= 0) {
                gameState.projectiles.push({
                    x: isPlayer1 ? player.x + config.playerSize : player.x - config.playerSize,
                    y: player.y,
                    dx: isPlayer1 ? config.projectileSpeed : -config.projectileSpeed,
                    dy: 0,
                    color: player.color,
                    owner: isPlayer1 ? 'player1' : 'player2'
                });
                createShootSound();
                player.cooldown = config.fireCooldown;
            }
        }

        function updateProjectiles() {
            for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
                const p = gameState.projectiles[i];
                p.x += p.dx;

                if (p.x < 0 || p.x > FIXED_WIDTH) {
                    gameState.projectiles.splice(i, 1);
                    continue;
                }

                const target = p.owner === 'player1' ? gameState.player2 : gameState.player1;
                if (target.isAlive && target.health > 0) {
                    const dx = p.x - target.x;
                    const dy = p.y - target.y;
                    if (Math.sqrt(dx*dx + dy*dy) < config.playerSize + config.projectileSize) {
                        target.health -= 25;
                        gameState.projectiles.splice(i, 1);
                        createHitAnimation(p.x, p.y, target.color);
                        createHitSound();

                        if (target.health <= 0) {
                            target.isAlive = false;
                            target.respawnTimer = config.respawnTime;
                            (p.owner === 'player1' ? gameState.player1 : gameState.player2).score++;
                            createExplosionAnimation(target.x, target.y);
                            createExplosionSound();
                        }
                    }
                }
            }
        }

        function updateGame() {
            if (!gameState.gameRunning) return;

            updatePlayer(gameState.player1, true);
            updatePlayer(gameState.player2, false);

            gameState.player1.cooldown = Math.max(0, gameState.player1.cooldown - 1);
            gameState.player2.cooldown = Math.max(0, gameState.player2.cooldown - 1);

            if (!gameState.player1.isAlive) {
                gameState.player1.respawnTimer--;
                if (gameState.player1.respawnTimer <= 0) {
                    gameState.player1.isAlive = true;
                    gameState.player1.health = config.maxHealth;
                    gameState.player1.x = FIXED_WIDTH / 4;
                    gameState.player1.y = FIXED_HEIGHT / 2;
                }
            }
            if (!gameState.player2.isAlive) {
                gameState.player2.respawnTimer--;
                if (gameState.player2.respawnTimer <= 0) {
                    gameState.player2.isAlive = true;
                    gameState.player2.health = config.maxHealth;
                    gameState.player2.x = FIXED_WIDTH * 3/4;
                    gameState.player2.y = FIXED_HEIGHT / 2;
                }
            }

            updateProjectiles();
            updateAnimations();

            if (gameState.player1.score >= config.pointsToWin) { gameState.winner = 1; gameState.gameRunning = false; }
            if (gameState.player2.score >= config.pointsToWin) { gameState.winner = 2; gameState.gameRunning = false; }

            updateHealthBars();
            updateScoreDisplay();
            updateGameStatus();
        }

        function gameLoop() {
            updateGame();
            drawGame(ctx1, true);
            drawGame(ctx2, false);
            requestAnimationFrame(gameLoop);
        }

        // Concise fix: only prevent scroll on arrow keys (the only ones causing issues)
        const arrowKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

        document.addEventListener('keydown', e => {
            if (arrowKeys.includes(e.key)) e.preventDefault();

            if (['w','W'].includes(e.key)) gameState.player1.keys.up = true;
            if (['s','S'].includes(e.key)) gameState.player1.keys.down = true;
            if (['a','A'].includes(e.key)) gameState.player1.keys.left = true;
            if (['d','D'].includes(e.key)) gameState.player1.keys.right = true;
            if (e.key === ' ') { gameState.player1.keys.shoot = true; e.preventDefault(); }

            if (e.key === 'ArrowUp') gameState.player2.keys.up = true;
            if (e.key === 'ArrowDown') gameState.player2.keys.down = true;
            if (e.key === 'ArrowLeft') gameState.player2.keys.left = true;
            if (e.key === 'ArrowRight') gameState.player2.keys.right = true;
            if (e.key === 'Enter') { gameState.player2.keys.shoot = true; e.preventDefault(); }
        });

        document.addEventListener('keyup', e => {
            if (arrowKeys.includes(e.key)) e.preventDefault();

            if (['w','W'].includes(e.key)) gameState.player1.keys.up = false;
            if (['s','S'].includes(e.key)) gameState.player1.keys.down = false;
            if (['a','A'].includes(e.key)) gameState.player1.keys.left = false;
            if (['d','D'].includes(e.key)) gameState.player1.keys.right = false;
            if (e.key === ' ') gameState.player1.keys.shoot = false;

            if (e.key === 'ArrowUp') gameState.player2.keys.up = false;
            if (e.key === 'ArrowDown') gameState.player2.keys.down = false;
            if (e.key === 'ArrowLeft') gameState.player2.keys.left = false;
            if (e.key === 'ArrowRight') gameState.player2.keys.right = false;
            if (e.key === 'Enter') gameState.player2.keys.shoot = false;
        });

        restartBtn.addEventListener('click', initGame);
        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? 'SOUND: ON' : 'SOUND: OFF';
            soundToggle.style.background = soundEnabled
                ? 'linear-gradient(45deg, #3366ff, #0044ff)'
                : 'linear-gradient(45deg, #666, #444)';
        });

        document.addEventListener('click', () => initAudioContext(), { once: true });
        document.addEventListener('keydown', () => initAudioContext(), { once: true });

        initGame();
        gameLoop();
    </script>
</body>
</html>
